# Method parameters for the Snakefile.
#
# Data paths come from `config.json` at the repository root (copy
# `config.example.json`), shared with the preprocessing scripts. The `paths`
# below are used only if there is no `config.json`.
paths:
  incoming_data: "incoming_data"
  data: "processed_data"
  figures: "figures"
  results: "results"

hazard:
  # Undefended fluvial return period maps, relative to paths.data
  rp_path: "hazards/flrf_ud_Q{RP}.tif"
  return_periods: [20, 50, 100, 200, 500, 1500]
  # Hazard onset return period: zero depth at or below this RP for cells
  # first wet at the lowest mapped RP. Cells first wet at a higher mapped RP
  # start at the mean of that RP and the one below it (see README).
  horp: 11

haz:
  path: "basins/haz_500.gpkg"
  id_column: "T500_ID"

events:
  types: ["Obs", "Sim"]
  # Relative to paths.data; {TYPE} is one of events.types
  rp_path: "events/{TYPE}EventRp.csv"
  op_path: "events/RiverOpInfo.gpkg"
  # A HAZ with no OP inside takes the nearest OP within this distance
  nearest_op_max_distance_m: 100000
  # CRS used to measure that distance (Africa Equidistant Conic)
  distance_crs: "ESRI:102023"

assets:
  # Continental layers, relative to paths.data; {layer} is e.g. road_edges
  source_path: "infrastructure/africa_{layer}_network.parquet"
  # Layers to run. Leave empty to use every source file that matches
  # source_path and ends in _edges, _nodes or _polygons.
  layers: []
  id_column: "id"

defended:
  # Relative to paths.data; set to null to skip defended areas
  path: "defended_areas/defended_areas.gpkg"
  sop_column: "JBA_SoP"

damage:
  # Relative to paths.data: costs/{layer}.csv and curves/{asset_type}/{cost_type}.csv
  cost_path: "costs/{layer}.csv"
  curves_dir: "curves/{asset_type}"

admin:
  # Admin-1 polygons with an admin-0 attribute (e.g. GADM level 1), relative
  # to paths.data. Set path to null to skip admin aggregation.
  path: "admin/adm1.gpkg"
  adm1_column: "GID_1"
  adm0_column: "GID_0"

risk:
  # Event set used for expected annual and exceedance values
  event_type: "Sim"
  # Years the event set represents
  years: 10000
  # Annual exceedance probabilities to report (1/p is the return period)
  exceedance_probabilities: [0.1, 0.05, 0.02, 0.01, 0.005, 0.002, 0.001]

disconnection:
  # Draft population-disconnected and detour metrics, and static criticality;
  # set enabled to false to skip
  enabled: true
  network_layer: "road_edges"
  # An asset fails when its maximum flood depth reaches this (m)
  depth_threshold_m: 0.5
  # JRC GHS-POP 2020 1 km grid, relative to paths.data
  population_path: "population/GHS_POP_E2020_GLOBE_R2023A_54009_1000_V1_0.tif"
  # JRC GHSL Urban Centre Database, relative to paths.data
  centres_path: "population/GHS_UCDB.gpkg"
  centre_id_column: "ID_UC_G0"
  # Metric CRS used to blend population and centres into the roads (snapping
  # distances are measured in it; route lengths are geodesic)
  network_crs: "ESRI:102023"
  # Furthest a population cell or urban centre may be from a road (m)
  max_snap_m: 5000
  # Road ends this close are joined, and a blended point this close to a road
  # end connects to the end rather than splitting the road (m)
  node_tolerance_m: 1.0
  # Events, and assets for static criticality, are processed in this many parallel chunks
  chunks: 20
  criticality_chunks: 20

resources:
  split_assets_mem_mb: 8000
  event_damages_mem_mb: 8000
  risk_mem_mb: 32000
  disconnection_mem_mb: 32000
